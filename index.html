<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מסע הכלים</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Rubik:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" dir="rtl" lang="he">
  <header class="topbar col">
    <button class="brand" id="homeBtn" type="button">מסע הכלים</button>
    <span class="starcount" id="starCount" title="הכוכבים שנאספו"></span>
    <button class="iconbtn" id="soundBtn" type="button" aria-pressed="true"></button>
    <button class="iconbtn" id="parentsBtn" type="button">להורים</button>
  </header>
  <nav class="path col" id="path" aria-label="ארבעת הכלים" hidden></nav>
  <main class="col" id="stage"></main>
  <div class="modal" id="modal" hidden></div>
</div>
<script src="themes/football.js"></script>
<script src="themes/space.js"></script>
<script src="themes/baking.js"></script>
<script src="themes/puppy.js"></script>
<script src="themes/school-morning.js"></script>
<script src="js/app.js"></script>
</body>
</html>
